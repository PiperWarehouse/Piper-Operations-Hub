/* Look & feel mirrors the Piper Warehouse Dock Scheduler: navy accent, Segoe UI,
   uppercase letter-spaced labels, white cards on a cool grey page, top header + tab bar. */
:root {
  --bg: #f0f2f7; --surface: #ffffff; --surface2: #f7f8fc; --border: #e2e6ef;
  --text: #1a2035; --text2: #6b7a99;
  --accent: #1a3a6b; --accent2: #1a9e7a; --warning: #d97706; --danger: #e03e3e;
  --brown: #6b3a1a; --green: #1a6b4a; --purple: #6b21a8; --teal: #0d9488;
  --font: 'Segoe UI', system-ui, sans-serif;

  /* names used throughout the app, mapped onto the palette above */
  --navy: var(--accent); --navy-2: #2f5590; --ink: var(--text); --muted: var(--text2); --line: var(--border); --card: var(--surface);
  --good: var(--accent2); --good-bg: rgba(26,158,122,.12); --bad: var(--danger); --bad-bg: rgba(224,62,62,.12);
  --warn: var(--warning); --warn-bg: rgba(217,119,6,.12); --info: var(--accent); --info-bg: rgba(26,58,107,.10);
  --input: var(--surface2); --radius: 12px;
  font: 14px/1.45 var(--font); color: var(--text);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: var(--font); }
a { color: var(--accent); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; margin: 0; color: var(--text); }
h2 { font-size: 12px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text); }
h3 { font-size: 12px; font-weight: 700; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); }
pre { white-space: pre-wrap; font-size: 12px; }
.muted { color: var(--text2); } .small { font-size: 12px; } .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.loading { padding: 60px; text-align: center; color: var(--text2); font-size: 13px; }

/* ── HEADER ─────────────────────────────────────────────────────── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hdr-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

.hdr-logo { height: 110px; }
.hdr-title { font-size: 18px; color: var(--text2); letter-spacing: 3px; font-weight: 700; border-left: 1px solid var(--border); padding-left: 16px; line-height: 1.15; white-space: nowrap; }
.hdr-title small { display: block; font-size: 12px; letter-spacing: 2px; color: var(--accent2); margin-top: 3px; }

.header-sep { font-size: 12px; color: var(--text2); }

.header-user small { font-weight: 700; color: var(--accent2); margin-left: 4px; }

/* ── NAV TABS ───────────────────────────────────────────────────── */

main { padding: 20px 24px 60px; min-width: 0; width: 100%; max-width: 2200px; margin: 0 auto; flex: 1; }

.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .split2 > .card { margin-bottom: 0; } .split2 { margin-bottom: 16px; }

/* in-page tabs (building, rail customer) */

.tab { padding: 10px 18px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text2); margin-bottom: -2px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { text-decoration: none; color: var(--text); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }

.xl-trio { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.6fr); gap: 16px; align-items: start; margin-top: 18px; }
@media (max-width: 860px) { .xl-trio { grid-template-columns: 1fr; } }
.xl-trio-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: #000; margin-bottom: 4px; }
.xl-emp-wrap { max-height: 340px; overflow-y: auto; border: 1px solid #d9d9d9; }
table.xl-emp { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.xl-emp th { background: var(--xl-dark); color: #fff; font-weight: 700; padding: 4px 6px; text-align: center; position: sticky; top: 0; z-index: 1; border-right: 1px solid #44505e; }
.xl-emp td { padding: 2px 6px; text-align: center; border: 1px solid #d9d9d9; white-space: nowrap; }
.xl-emp tbody tr:nth-child(even) td { background: #fafafa; }
.xl-emp td.emp { text-align: left; }
.xl-emp td.emp a { color: #0b33c2; text-decoration: none; }
.xl-emp td.emp a:hover { text-decoration: underline; }
.xl-emp td.dbar { position: relative; min-width: 64px; }
.xl-emp td.dbar i { position: absolute; left: 2px; top: 2px; bottom: 2px; min-width: 5px; max-width: calc(100% - 4px); background: linear-gradient(90deg, #5b7395, rgba(91, 115, 149, .08)); }
.xl-emp td.dbar span { position: relative; }
.xl-emp td.none { padding: 20px; color: #7f7f7f; }
.xl-chart { border: 1px solid #d9d9d9; background: #fff; padding: 10px 12px 4px; }
.xl-chart h4 { margin: 0 0 6px; text-align: center; font-size: 15px; font-weight: 700; color: #000; }

/* 6021 breakdown panels (by category / customer / type / responsible party) */
.xl-panels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
@media (max-width: 1300px) { .xl-panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .xl-panels { grid-template-columns: 1fr; } }
.xp { border: 1px solid #d9d9d9; background: #fff; display: flex; flex-direction: column; }
.xp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: var(--xl-dark); color: #fff; padding: 8px 12px; border-bottom: 3px solid var(--xl-red); }
.xp-head span { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.xp-head b { font-size: 12px; font-weight: 600; color: #c9d0da; white-space: nowrap; }
.xp-list { list-style: none; margin: 0; padding: 4px 0; }
.xp-list li { display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(60px, 34%) 26px 32px; gap: 8px; align-items: center; padding: 5px 12px; font-size: 12px; color: #1f2733; }
.xp-list li:nth-child(even) { background: var(--xl-cream); }
.xp-rank { width: 18px; height: 18px; border-radius: 50%; background: #e6e9ee; color: #44505e; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.xp-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xp-bar { height: 8px; background: #e9e4da; border-radius: 4px; overflow: hidden; }
.xp-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2f4a6b, #4d6f99); }
.xp-val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.xp-pct { text-align: right; font-size: 12px; color: #7f7f7f; font-variant-numeric: tabular-nums; }
.xp-list li.lead .xp-rank { background: var(--xl-red); color: #fff; }
.xp-list li.lead .xp-label { font-weight: 700; }
.xp-list li.lead .xp-bar i { background: linear-gradient(90deg, #a93226, #d9604f); }
.xp-list li.lead .xp-val { color: var(--xl-red); }
.xp-more, .xp-note, .xp-empty { padding: 4px 12px 8px; font-size: 12px; font-style: italic; color: #7f7f7f; margin: 0; }
.xp-note { margin-top: auto; border-top: 1px solid #eee; padding-top: 6px; }

/* ── DAMAGE SCORECARD (matches the workbook tab) ─────────────────── */
.dmg-sc { --ds-dark: #222b36; --ds-red: #c0392b; --ds-grid: #d9d9d9; background: #fff; border: 1px solid var(--ds-grid); padding-bottom: 16px; color: #000; }
.ds-banner { background: var(--ds-dark); color: #fff; padding: 8px 16px 6px; }
.ds-banner h1 { margin: 0 0 12px; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: .2px; }
.ds-banner p { margin: 0; font-size: 12px; font-style: italic; color: #e6e9ee; }
.ds-home { display: inline-block; margin: 4px 16px 0; font-size: 12px; font-weight: 700; color: #0563c1; text-decoration: underline; }
.ds-meta { display: flex; align-items: baseline; gap: 10px; padding: 4px 16px 0; font-size: 12px; }
.ds-meta b { color: #000; }
.ds-year { color: var(--ds-red); font-weight: 700; min-width: 120px; }
.ds-last { font-weight: 700; min-width: 70px; }
.ds-meta i { color: #595959; font-size: 12px; margin-left: 40px; }
.ds-title { margin: 6px 16px 4px; font-size: 12px; font-weight: 700; color: var(--ds-red); }
.ds-sub { margin: 18px 0 4px; font-size: 12px; font-weight: 700; color: #000; }
table.ds { border-collapse: collapse; font-size: 12px; color: #000; font-variant-numeric: tabular-nums; width: 100%; }
.ds th { background: var(--ds-dark); color: #fff; font-weight: 700; font-size: 12px; line-height: 1.25; padding: 6px 6px; text-align: center; border: 1px solid #44505e; }
.ds td { padding: 2px 6px; text-align: center; border: 1px solid var(--ds-grid); white-space: nowrap; }
.ds .lbl { text-align: left; }
.ds th.lbl { text-align: center; }
.ds tbody tr:nth-child(even) td { background: #f2f2f2; }
.ds tr.tot td { font-weight: 700; background: #fff; border-top: 2px solid #000; }
.ds td.ok { background: #e2efda; color: #375623; font-weight: 700; }
.ds td.over { background: #fde3e3; color: #c00000; font-weight: 700; }
.ds td.none { padding: 16px; color: #7f7f7f; }
table.ds.ds-sum { margin: 0 16px; width: auto; }
.ds-sum th:not(.lbl), .ds-sum td:not(.lbl) { min-width: 62px; }
.ds-sum td.lbl { min-width: 100px; }
.ds-foot { margin: 4px 16px 0; font-size: 12px; font-style: italic; color: #595959; }
.ds-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding: 0 16px; }
.ds-pair > div { min-width: 0; overflow-x: auto; }
@media (max-width: 1100px) { .ds-pair { grid-template-columns: 1fr; } }

/* Vertical dividers between columns (e.g. the per-employee attendance scorecard). */
.grid.ruled td, .grid.ruled th { border-right: 1px solid var(--border); }
.grid.ruled td:last-child, .grid.ruled th:last-child { border-right: none; }
.grid td.empty { text-align: center; color: var(--text2); padding: 40px; font-size: 13px; }
.grid.entry input, .grid.entry select { width: 100%; min-width: 80px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface2); font: 600 12px var(--font); color: var(--text); outline: none; }
.grid.entry input:focus, .grid.entry select:focus { border-color: var(--accent); background: #fff; }
.grid.entry input[type=number] { text-align: right; }
.more { text-align: center; padding: 12px; }

/* status badges: pill, uppercase */
.free-pill { display: inline-block; min-width: 28px; padding: 2px 8px; border-radius: 20px; font-weight: 800; text-align: center; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: rgba(107,122,153,.12); color: var(--text2); white-space: nowrap; }
.badge.good { background: var(--good-bg); color: var(--accent2); } .badge.bad { background: var(--bad-bg); color: var(--danger); }
.badge.warn { background: var(--warn-bg); color: var(--warning); } .badge.info { background: var(--info-bg); color: var(--accent); }
.warnline { display: flex; gap: 12px; align-items: center; background: rgba(217,119,6,.08); color: var(--warning); border: 1px solid var(--warning); padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; }

.barlist { list-style: none; margin: 0; padding: 0; }
.barlist li { display: grid; grid-template-columns: minmax(80px, 40%) 1fr 40px; gap: 8px; align-items: center; padding: 3px 0; font-size: 12px; }
.bl-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-bar { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; height: 10px; } .bl-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bl-val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart { position: relative; margin: 6px 0 14px; }

/* ── TOOLBAR + BUTTONS ──────────────────────────────────────────── */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .grow { flex: 1; } .toolbar .count { color: var(--text2); font-size: 12px; }
input, select, textarea { font: inherit; color: inherit; }
.toolbar input, .toolbar select, .actions select { font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); outline: none; }
.toolbar input:focus, .toolbar select:focus, .actions select:focus { border-color: var(--accent); }
.search { min-width: 220px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.btn { display: inline-block; padding: 9px 20px; border-radius: 7px; border: 1px solid var(--border); font: 600 12px var(--font); cursor: pointer; background: var(--surface); color: var(--text); transition: .15s; }
.btn:hover { text-decoration: none; background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.primary:hover { opacity: .88; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; } .btn.danger:hover { opacity: .88; }
.btn.ghost { background: transparent; } .btn.small { padding: 5px 12px; font-size: 12px; }
.btn.link { background: none; border-color: transparent; color: var(--accent); padding: 9px 4px; } .btn.block { display: block; width: 100%; margin-bottom: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text2); padding: 4px 8px; }
textarea.paste { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px; border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; background: var(--surface2); outline: none; }
textarea.paste:focus { border-color: var(--accent); background: #fff; }

/* home quick actions — door-card style */
.actions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.action { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: block; background: var(--surface); transition: .18s; }
.action b { display: block; color: var(--accent); font-size: 13px; } .action span { font-size: 12px; color: var(--text2); font-weight: 400; }
.action:hover { border-color: var(--accent); text-decoration: none; box-shadow: 0 2px 10px rgba(26,58,107,.08); }

/* ── MODAL + FORMS ──────────────────────────────────────────────── */
.modal-back { position: fixed; inset: 0; background: rgba(10,20,40,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; z-index: 1000; }
.modal { background: var(--surface); border-radius: 16px; width: min(820px, 100%); padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.modal-head h2 { font-size: 14px; }
.modal-foot { display: flex; justify-content: space-between; margin-top: 20px; } .modal-foot div { display: flex; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: var(--text2); }
.field.wide { grid-column: 1 / -1; }
.field input, .field select, .field textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface2); font: 400 13px var(--font); letter-spacing: normal; text-transform: none; color: var(--text); outline: none; transition: .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: #fff; }
.field textarea { resize: vertical; min-height: 60px; }
.field small { font-weight: 400; letter-spacing: normal; text-transform: none; font-size: 12px; } .req { color: var(--danger); margin-left: 2px; }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sticky-save { margin-top: 12px; }

/* ── LOGIN ──────────────────────────────────────────────────────── */
.login { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; background: var(--bg); }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: min(420px, 100%); text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,.10); }
.login-logo { width: 150px; margin: 0 auto 8px; }
.login-sub { font-size: 12px; color: var(--text2); letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
.login-loc { font-size: 12px; color: var(--accent2); letter-spacing: 1px; margin-bottom: 20px; font-weight: 600; }
.login-section-label { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin: 16px 0 8px; text-align: left; }
.login-card p { font-size: 13px; }
.login-card .warnline { text-align: left; }
.user-btn { display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font: 700 13px var(--font); color: var(--text); text-align: center; transition: .15s; }
.user-btn:hover { background: rgba(26,58,107,.07); border-color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.stack input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
.stack input:focus { border-color: var(--accent); }
.stack .user-btn { margin: 2px 0 0; }
.login-links { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.login-links .btn.link { font-size: 12px; padding: 4px 8px; color: var(--text2); }
.login-links .btn.link:hover { color: var(--accent); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ── ALERTS ─────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent2); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,.15); opacity: 0; transform: translateY(10px); transition: .3s; z-index: 9999; max-width: 420px; }
.toast.show { opacity: 1; transform: none; } .toast.bad { background: var(--danger); }

/* ── TABLET / PHONE ─────────────────────────────────────────────── */
@media (max-width: 1100px) { .split4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 1024px) {
  main { padding: 14px 12px 40px; }
  .header { padding: 10px 12px; gap: 8px 10px; }
  .hdr-logo { height: 60px; }
  .nav-tabs { padding: 6px 12px 0; }
  .nav-tab { padding: 12px 18px; }
  .sub-tabs { padding: 0 12px; }
  /* clip (not hidden): hidden turns the page into a scroll container, which stops the tab bar from sticking */
  html, body { overflow-x: clip; max-width: 100%; }
}
@media (max-width: 860px) {
  .split2, .split4 { grid-template-columns: 1fr; }
  .search { min-width: 0; flex: 1; }
}
@media (max-width: 640px) {
  .hdr-logo { height: 38px; }
  .hdr-title { display: none; }
  .header-date, .header-sep { display: none; }
  .nav-tab { padding: 12px 14px; letter-spacing: 1px; }
  .login-card { padding: 28px 20px; }
}
@media print {
  .header-right, .tabbar, .toolbar, .actions { display: none !important; }
  .hdr-logo { height: 60px; } main { padding: 0; } .card { break-inside: avoid; }
}

/* ── 6021 DASHBOARD POLISH ───────────────────────────────────────────
   One spacing scale (4/8/12/16/24), one radius (8px), calmer borders, clearer type hierarchy,
   visible keyboard focus, and layouts that step down cleanly on tablets and phones. */
.xl-dash { --xl-line: #e3e6ec; --xl-ink: #1c232d; --xl-ink2: #4a5262; --xl-muted: #6b7385; }
.xl-dash .card, .xl-dash-head { border-radius: 8px; border-color: var(--xl-line); box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
.xl-dash .card { padding: 20px 24px 24px; margin-bottom: 20px; }
.xl-dash-head { overflow: hidden; margin-bottom: 20px; }
.xl-banner { padding: 14px 24px 12px; }
.xl-banner h1 { font-size: 22px; margin-bottom: 10px; letter-spacing: .2px; }
.xl-banner p { font-size: 12.5px; line-height: 1.45; max-width: 980px; }
.xl-meta { padding: 12px 24px; border-bottom: 1px solid var(--xl-line); }
.xl-tiles { margin: 0 24px 4px; border: 1px solid #ebe5d9; border-radius: 6px; overflow: hidden; }
.xl-dash-head .xl-tiles { margin-top: 12px; }
.xl-label { padding: 0 24px; margin-top: 14px; font-size: 12px; letter-spacing: .4px; }
.xl-dash .card > .xl-label { margin-top: 0; }
.xl-tiles .kpi { padding: 14px 12px 12px; }
.xl-tiles .kpi-label { font-size: 12px; color: var(--xl-ink2); letter-spacing: .5px; }
.xl-tiles .kpi-value, .xl-tiles .kpi.good .kpi-value, .xl-tiles .kpi.bad .kpi-value, .xl-tiles .kpi.warn .kpi-value { font-size: 30px; color: var(--xl-ink); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.xl-tiles .kpi-note { color: var(--xl-muted); line-height: 1.4; }
/* Target status as a small colored marker on the tile (color is never the only cue: the note states the target). */
.xl-tiles .kpi.good .kpi-label::after { content: ' ●'; color: #1a9e7a; }
.xl-tiles .kpi.bad .kpi-label::after { content: ' ●'; color: #c0392b; }

/* Jump bar */
.xl-jump { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 24px 16px; border-top: 1px solid var(--xl-line); margin-top: 16px; }
.xl-jump span { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--xl-muted); margin-right: 4px; }
.xl-jump button { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--xl-ink); background: #f4f5f8; border: 1px solid var(--xl-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .15s, border-color .15s; }
.xl-jump button:hover { background: #fff; border-color: var(--xl-red); color: var(--xl-red); }
.xl-anchor { scroll-margin-top: 140px; }
.xl-anchor h2:focus { outline: none; }

/* Section headings */
.xl-dash .card-head { padding-bottom: 12px; margin-bottom: 18px; border-bottom: 2px solid var(--xl-red); }
.xl-dash .card-head h2 { font-size: 20px; color: var(--xl-ink); }
.xl-trio-title { font-size: 12.5px; letter-spacing: .5px; color: var(--xl-ink); margin-bottom: 8px; }

/* Charts */
.xl-chart { border-color: var(--xl-line); border-radius: 8px; padding: 14px 16px 8px; }
.xl-chart h4 { font-size: 14px; font-weight: 700; color: var(--xl-ink); margin-bottom: 10px; }
.xl-ot-row, .xl-trio { gap: 20px; margin-top: 24px; }
.xl-panels { gap: 16px; margin-top: 24px; }

/* Tables: calmer grid, readable numbers, row hover, sticky headers stay crisp */
.xl-otif-wrap, .xl-emp-wrap { border: 1px solid var(--xl-line); border-radius: 6px; }
table.xl-otif, table.xl-emp { font-size: 12.5px; }
.xl-otif th, .xl-emp th { font-size: 12px; letter-spacing: .2px; padding: 8px 8px; vertical-align: middle; }
.xl-otif td { padding: 5px 8px; border-color: #e7e9ee; color: var(--xl-ink); }
.xl-emp td { padding: 4px 8px; border-color: #e7e9ee; }
.xl-otif tbody tr:nth-child(even) td, .xl-emp tbody tr:nth-child(even) td { background: #f7f8fa; }
.xl-otif tbody tr:hover td, .xl-emp tbody tr:hover td { background: #eef2f8; }
.xl-otif td.ok, .xl-otif td.below { font-size: 12px; }
.xl-otif tfoot td { background: #eceef2; border-top: 2px solid var(--xl-ink); }
.xl-foot { margin-top: 8px; color: var(--xl-muted); line-height: 1.45; }

/* Breakdown panels */
.xp { border-color: var(--xl-line); border-radius: 8px; overflow: hidden; }
.xp-list li { padding: 6px 12px; }

/* Keyboard focus that is always visible */
.xl-dash a:focus-visible, .xl-dash button:focus-visible, .xl-dash select:focus-visible { outline: 2px solid var(--xl-red); outline-offset: 2px; border-radius: 4px; }

/* Responsive */
@media (max-width: 1100px) {
  .xl-dash .card { padding: 16px; }
  .xl-tiles .kpi-value, .xl-tiles .kpi.good .kpi-value, .xl-tiles .kpi.bad .kpi-value, .xl-tiles .kpi.warn .kpi-value { font-size: 26px; }
}
@media (max-width: 900px) {
}
@media (max-width: 640px) {
  .xl-banner { padding: 12px 16px; } .xl-banner h1 { font-size: 17px; } .xl-banner p { font-size: 12px; }
  .xl-meta, .xl-jump { padding-left: 16px; padding-right: 16px; }
  .xl-tiles { margin-left: 12px; margin-right: 12px; grid-template-columns: 1fr; }
  .xl-tiles .kpi { border-left-width: 3px; border-bottom: 1px solid #ebe5d9; }
  .xl-label { padding: 0 16px; }
  .xl-dash .card-head h2 { font-size: 17px; }
  .xl-meta-title { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .xl-jump button { transition: none; } }

/* ════════════════════════════════════════════════════════════════════
   APP-WIDE POLISH — applies to every page.
   Same palette and structure; better contrast, a consistent 4/8/12/16/24 spacing scale,
   larger small-print, calmer borders, visible keyboard focus and cleaner tables/forms.
   ════════════════════════════════════════════════════════════════════ */
:root {
  --text2: #586480;          /* was #6b7a99 — now passes WCAG AA (4.5:1) on white and on the page grey */
  --border: #e1e5ee;
  --radius: 10px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-md: 0 4px 16px rgba(16, 24, 40, .08);
  --focus: 0 0 0 3px rgba(47, 85, 144, .35);
}
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: rgba(47, 85, 144, .18); }

/* Keyboard focus is always visible; mouse clicks don't leave rings behind. */
:where(a, button, select, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--navy-2); outline-offset: 2px; border-radius: 4px; }
.skip-focus:focus { outline: none; }

/* Type scale: nothing below 10px, clearer hierarchy. */
h1 { font-size: 20px; letter-spacing: .5px; }
h2 { font-size: 12.5px; letter-spacing: 1.2px; }
h3 { font-size: 12px; letter-spacing: 1.4px; margin: 20px 0 10px; }
.page-head { margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.page-head .sub { font-size: 12.5px; line-height: 1.5; }

/* Navigation */
.nav-tab { transition: color .15s, border-color .15s; }
.sub-tab { font-size: 12px; padding: 11px 14px; transition: color .15s, border-color .15s; }
.tab { font-size: 12px; padding: 11px 18px; transition: color .15s, border-color .15s; }
.tab.on, .sub-tab.on { font-weight: 800; }

/* Cards */
.card { border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 20px 22px; margin-bottom: 20px; }
.card-head { margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.split2 { gap: 20px; margin-bottom: 20px; }

/* KPI tiles (non-dashboard pages) */
.kpis { gap: 12px; margin-bottom: 20px; }
.kpi { border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); }
.kpi-label { font-size: 12px; letter-spacing: 1.1px; margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi-note { font-size: 12px; margin-top: 2px; line-height: 1.4; }

/* Tables */
.table-wrap { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card .table-wrap { box-shadow: none; }
table.grid { font-size: 12.5px; }
.grid th { font-size: 12px; letter-spacing: .9px; padding: 10px 10px; color: var(--text2); background: #f5f7fb; z-index: 1; }
.grid td { padding: 9px 10px; }
.grid tbody tr:nth-child(even) td { background: #fafbfd; }
.grid tbody tr:hover td { background: #eef3fa; }
.grid tfoot td { padding: 10px; }
.grid td.empty { padding: 48px 20px; }
.grid th[data-sort]::after { content: ' ↕'; opacity: .35; font-size: 12px; }
.grid th[data-sort]:hover::after { opacity: .8; }

/* Badges & pills */
.badge { font-size: 12px; padding: 3px 10px; letter-spacing: .6px; }

/* Bar lists */
.barlist li { padding: 4px 0; font-size: 12.5px; }
.bl-bar { height: 10px; border-radius: 5px; border-color: transparent; background: #edf0f5; }
.bl-bar i { border-radius: 5px; }

/* Charts */
.chart { margin: 8px 0 16px; }

/* Buttons and inputs: one height, one radius, clear states */
.btn { border-radius: 8px; padding: 9px 18px; font-size: 12.5px; transition: background .15s, border-color .15s, box-shadow .15s, opacity .15s; }
.btn:hover { border-color: #cfd6e3; }
.btn.small { padding: 6px 12px; font-size: 12px; }
.btn:focus-visible { box-shadow: var(--focus); outline: none; }
.toolbar { gap: 10px 12px; }
.toolbar input, .toolbar select, .actions select { padding: 7px 10px; font-size: 12.5px; border-radius: 8px; min-height: 34px; }
.toolbar input:focus, .toolbar select:focus, .actions select:focus { box-shadow: var(--focus); }
.toolbar .count { font-size: 12px; }
label.inline { font-size: 12.5px; }

/* Forms & modal */
.modal { border-radius: 14px; padding: 26px 28px; }
.modal-head { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }

.field .multi summary::-webkit-details-marker { display: none; }
.field .multi summary::after { content: '▾'; position: absolute; right: 12px; color: var(--text2); }

/* Home quick actions */

.action { padding: 14px 16px; border-radius: var(--radius); }
.action span { font-size: 12px; }

/* Toasts */
.toast { border-radius: 10px; }

/* Workbook-style pages (scorecards) — same polish as the dashboards */

@media (max-width: 900px) { .xl-tiles[style] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } .xl-tiles .kpi { border-bottom: 1px solid #ebe5d9; } }
@media (max-width: 640px) { .xl-tiles[style] { grid-template-columns: minmax(0, 1fr) !important; } }

/* Small screens: comfortable touch targets, no sideways page scroll */
@media (max-width: 860px) {

  .page-head { align-items: flex-start; }

/* Log tables: short values stay on one line; long text is clipped with a hover tooltip. */

/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   REDESIGN (Nov 2026, Visual Redesign proposal VR-01 – VR-26). One layer on top of everything above.
   Colours: navy primary, Piper red as an accent only, status colours with one meaning everywhere.
   The workbook productivity colour bands are set inline by the dashboard code and are not touched here.
   Breakpoints: 640 · 1024 · 1280.
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  --navy: #16325c; --navy-2: #1f4a85; --brand-red: #b3282d;
  --ink: #1d2733; --ink-2: #4a5868; --ink-3: #6b7786; --line: #e2e7ee; --line-2: #eef1f5; --page: #f4f6f9;
  --good: #1e8e5a; --good-bg: #e6f4ec; --warn: #c27c0e; --warn-bg: #fdf3e1; --bad: #c0392b; --bad-bg: #fbeaea; --info: #2f6fb5; --info-bg: #e8f0fa;
  --accent: var(--navy); --text: var(--ink); --text2: var(--ink-3); --border: var(--line); --bg: var(--page);
  --card-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07); --radius: 10px;
  --font: "Segoe UI", "Inter", system-ui, sans-serif; --sb-w: 236px;
}
body { background: var(--page); color: var(--ink); }
.xl-dash, .rail-xl, .sc-xl, .log-xl { --xl-dark: var(--navy); --xl-red: var(--brand-red); --xl-cream: #fff; --xl-line: var(--line); --xl-ink: var(--ink); --xl-ink2: var(--ink-2); --xl-muted: var(--ink-3); --rs-black: var(--navy); }

/* ── App shell: sidebar + top bar (VR-01, VR-02) ── */
.shell { display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--navy); color: #c9d6ea; display: flex; flex-direction: column; padding: 12px 10px; z-index: 40; scrollbar-width: thin; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.12); text-decoration: none !important; }
.sb-logo { height: 46px; width: 46px; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.sb-brand b { display: block; color: #fff; font-size: 12px; letter-spacing: .8px; } .sb-brand small { display: block; color: #9fb3d1; font-size: 12px; font-weight: 500; }
.sb-group h6 { margin: 12px 10px 4px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #8fa5c6; font-weight: 600; }
.sb-link { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px; color: #d6e0ee; font-size: 13px; font-weight: 500; text-decoration: none !important; }
.sb-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.sb-link.on { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--brand-red); }
.sb-link.sub { padding: 5px 10px 5px 36px; font-size: 12.5px; color: #b6c5dc; }
.sb-link.sub.on { background: rgba(255,255,255,.09); color: #fff; box-shadow: none; }
.sb-sub { margin: 2px 0 4px; }
.ico { width: 17px; height: 17px; flex: none; opacity: .9; }
.sb-count { margin-left: auto; background: var(--brand-red); color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 7px; font-weight: 700; }
.sb-foot { margin-top: auto; padding: 12px 8px 4px; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 6px; }
.sb-user { color: #fff; font-size: 12.5px; font-weight: 600; } .sb-user small { display: block; color: #9fb3d1; font-weight: 500; text-transform: capitalize; }
.sb-out { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid rgba(255,255,255,.18); color: #d6e0ee; border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.sb-out:hover { background: rgba(255,255,255,.08); color: #fff; }
.shell-main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: 58px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 22px; }
.tb-menu { display: none; background: none; border: 0; color: var(--navy); padding: 6px; cursor: pointer; } .tb-menu .ico { width: 22px; height: 22px; }

.sync-pill.good { background: var(--good-bg); color: var(--good); } .sync-pill.warn { background: var(--warn-bg); color: var(--warn); } .sync-pill.bad { background: var(--bad-bg); color: var(--bad); }
.tb-clock { flex: none; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
/* Version box (build-single.ps1 -Version / save-version.ps1). */
.tb-ver { flex: none; border: 1.5px solid var(--navy, #1a3a6b); color: var(--navy, #1a3a6b); background: #fff; border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 800; letter-spacing: .4px; white-space: nowrap; cursor: default; }

@media (max-width: 700px) { .tb-ver small { display: none; } }
main { padding: 18px 22px 60px; max-width: 1800px; }
.sb-scrim { display: none; }
/* Top button: small and round at the bottom-right (VR-23). */
.to-top { position: fixed !important; left: auto !important; top: auto !important; right: 18px; bottom: 18px; width: 42px; height: 42px; padding: 0 !important; border-radius: 50% !important; display: grid; place-items: center; font-size: 18px; background: var(--navy) !important; color: #fff !important; box-shadow: 0 4px 14px rgba(16,24,40,.25); z-index: 35; }

/* ── Page header: the dark banner becomes a light intro under the top bar title (VR-02, VR-06) ── */
.xl-dash-head { background: transparent !important; border: 0 !important; box-shadow: none !important; overflow: visible; margin-bottom: 14px; }
.xl-banner { background: transparent !important; border: 0 !important; padding: 0 0 8px !important; color: var(--ink-2); }

.xl-meta { background: #fff; border: 1px solid var(--line) !important; border-radius: var(--radius); padding: 9px 14px !important; flex-wrap: wrap; row-gap: 6px; font-size: 12.5px; color: var(--ink-2); box-shadow: var(--card-shadow); }
.xl-meta b { color: var(--ink-3) !important; font-weight: 600; } .xl-meta .xl-year, .xl-meta .xl-thru { color: var(--ink) !important; font-weight: 700; margin-right: 10px; }
.xl-meta-title { display: none !important; } /* VR-06: the centred label overlapped the dates; the top bar says where you are */
.xl-label, .xl-label.dark { padding: 0 !important; margin: 16px 0 8px !important; font-size: 12px !important; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3) !important; }
.xl-label a { color: var(--info) !important; text-transform: none; letter-spacing: 0; }

/* ── KPI cards (VR-05) ── */
.xl-tiles, .xl-tiles.q, .xl-tiles.w { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)) !important; gap: 12px; margin: 10px 0 4px !important; background: transparent !important; border: 0 !important; border-radius: 0; overflow: visible; }
.kpi, .xl-tiles .kpi, .xl-tiles.w .kpi { position: relative; background: #fff !important; border: 1px solid var(--line) !important; border-left: 4px solid #c3ccd8 !important; border-radius: var(--radius) !important; box-shadow: var(--card-shadow); padding: 12px 14px 10px !important; text-align: left !important; min-width: 0; }
.kpi.good, .xl-tiles .kpi.good { border-left-color: var(--good) !important; } .kpi.bad, .xl-tiles .kpi.bad { border-left-color: var(--bad) !important; } .kpi.warn, .xl-tiles .kpi.warn { border-left-color: var(--warn) !important; }

.xl-tiles .kpi .kpi-label::after { content: none !important; }
.kpi-value, .xl-tiles .kpi-value, .xl-tiles .kpi.good .kpi-value, .xl-tiles .kpi.bad .kpi-value, .xl-tiles .kpi.warn .kpi-value, .kpi.good .kpi-value, .kpi.bad .kpi-value, .kpi.warn .kpi-value { font-size: 25px !important; font-weight: 700 !important; color: var(--ink) !important; margin: 2px 0 4px !important; letter-spacing: -.3px; white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-value small { font-size: 13px !important; color: var(--ink-3) !important; font-weight: 600; }
.kpi-note, .xl-tiles .kpi-note { font-size: 12px !important; font-style: normal !important; color: var(--ink-3) !important; line-height: 1.4; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; }
.kpi-note a { color: var(--info) !important; font-weight: 600; }
.kpi-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.kpi-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.kpi-chip.good { background: var(--good-bg); color: var(--good); } .kpi-chip.warn { background: var(--warn-bg); color: var(--warn); } .kpi-chip.bad { background: var(--bad-bg); color: var(--bad); }
.kpi-spark { position: absolute; right: 10px; top: 10px; width: 60px !important; height: 24px !important; }
.kpi-bar { position: relative; height: 6px; background: var(--line-2); border-radius: 3px; margin: 4px 0 6px; overflow: visible; }
.kpi-bar i { display: block; height: 100%; border-radius: 3px; background: var(--navy-2); } .kpi-bar.good i { background: var(--good); } .kpi-bar.bad i { background: var(--bad); } .kpi-bar.warn i { background: var(--warn); }
.kpi-bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

/* ── Cards and section titles ── */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--card-shadow); }
.card-head h2, .xl-dash .card-head h2, .card > .card-head h2 { font-size: 16px !important; font-weight: 700 !important; text-transform: none !important; letter-spacing: 0 !important; color: var(--ink) !important; text-align: left !important; }
.card-head { justify-content: flex-start !important; border-bottom: 0 !important; padding-bottom: 0 !important; margin-bottom: 10px !important; }
.card-head::after, .card-head h2::after { display: none !important; }
.xl-trio-title { font-size: 13px !important; font-weight: 700 !important; text-transform: none !important; letter-spacing: 0 !important; color: var(--ink) !important; margin-bottom: 8px !important; }

.xl-foot, .rs-foot { font-style: normal !important; color: var(--ink-3) !important; font-size: 12px !important; }

.xl-otif-wrap, .xl-emp-wrap { border: 1px solid var(--line) !important; border-radius: 8px !important; background: #fff; }

.xl-otif td, .xl-emp td, .perf td { border: 0 !important; border-bottom: 1px solid var(--line-2) !important; padding: 6px 10px !important; font-variant-numeric: tabular-nums; color: var(--ink); }
.xl-otif td { text-align: right; } .xl-otif td.lbl, .xl-otif td:first-child, .xl-otif th:first-child { text-align: left; }
.xl-otif th { text-align: right; }

.rs-heading { color: var(--ink-3) !important; } .rs-bar { background: var(--navy) !important; border-top: 0 !important; }

/* ── Pills and badges ── */
.pill, .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 0; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good, .badge.good { background: var(--good-bg); color: var(--good); } .pill.warn, .badge.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad, .badge.bad { background: var(--bad-bg); color: var(--bad); }

/* ── Buttons ── */

.btn.danger { background: var(--bad); border-color: var(--bad); }

.cc-table td { white-space: nowrap; } .cc-table th { white-space: normal; } .cc-card .grid td:first-child { white-space: nowrap; } .cc-table tbody tr { cursor: pointer; } .cc-table tbody tr:hover td { background: #f6f9fd; }

/* ── Dashboard section tabs (VR-04) ── */
.dash-tabs { position: sticky; top: var(--tabbar-h, 58px); z-index: 20; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--page); border-bottom: 1px solid var(--line); margin: 0 0 14px; padding-top: 4px; }

.dash-tabs button:focus-visible { outline: 2px solid var(--navy-2); outline-offset: -2px; }
.tab-flag { font-style: normal; background: var(--bad-bg); color: var(--bad); border-radius: 9px; font-size: 12px; font-weight: 800; padding: 0 6px; line-height: 16px; }
.xl-ot-row.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 16px; }
.xl-otif.heat th.hc, .xl-otif.heat td.hc { text-align: center; min-width: 34px; padding-left: 4px !important; padding-right: 4px !important; font-weight: 600; }
.share-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 10px 0 6px; background: var(--line-2); }
.share-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); padding-bottom: 6px; } .share-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
/* Long notes fold into "How this is calculated" (VR-21). */
details.note-fold { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
details.note-fold summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: baseline; }
details.note-fold summary::-webkit-details-marker { display: none; }

/* ═══ UX audit fixes (Nov 2026). One layer on top of everything above. ═══
   Status text colours darkened to pass WCAG AA (4.5:1) on their tinted backgrounds and on white; the brighter
   shades stay for borders, bars and chart lines (--good-line etc.). Muted grey one step darker. */
:root {
  --good-line: #1e8e5a; --warn-line: #c27c0e; --bad-line: #c0392b;
  --good: #1a6b45; --warn: #8a4b00; --bad: #b02a1f; --info: #23599a;
  --ink-3: #5a6676; --text2: var(--ink-3); --muted: var(--ink-3);
}
.kpi.good, .xl-tiles .kpi.good { border-left-color: var(--good-line) !important; }
.kpi.bad, .xl-tiles .kpi.bad { border-left-color: var(--bad-line) !important; }
.kpi.warn, .xl-tiles .kpi.warn { border-left-color: var(--warn-line) !important; }
.kpi-bar.good i { background: var(--good-line); } .kpi-bar.bad i { background: var(--bad-line); } .kpi-bar.warn i { background: var(--warn-line); }

.chart > .chart-empty, .log-chart .chart-empty { position: absolute; inset: 0; min-height: 0; } .chart, .log-chart .chart { position: relative; }
